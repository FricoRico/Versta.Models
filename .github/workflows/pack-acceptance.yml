name: pack-acceptance

on:
  # Green on every commit, like the main CI: a pack that stops loading or
  # translating must surface on the commit that broke it.
  push: {}
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pack-acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `shell: bash` = bash --noprofile --norc -eo pipefail; pipefail is
# load-bearing whenever output is teed into logs. Same rule as leanmt CI.
defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Pack acceptance sweep (NEU-60 phase 1 -> NEU-61 phase 2, epic NEU-59).
  # Probes every bundle the v2.0.0 catalog publishes. The served packs predate
  # the NEU-25 leanmt_binary_version manifest handshake, so the sweep
  # re-packs each payload through the production versta.bundle path before
  # probing; payload bytes are unchanged by re-packing, and pins.json
  # ('published' section) pins both the served tar checksums and the per-file
  # payload hashes measured at first sweep. The direction-mislabeled
  # adversarial control (NEU-19 negative control) still runs — the harness
  # without a proven gate proves nothing.
  #
  # Everything input-side is pinned: served artifact contents
  # (pack-acceptance/pins.json, verified before repacking) and the leanmt
  # commit the probe binary is built from. Drift fails deliberately; re-pinning
  # is a dedicated commit with a measured scorecard diff (bench-baseline
  # discipline, NEU-16/22/23). Device-lab pass is NEU-63 (Phase 4).
  # ---------------------------------------------------------------------------
  probe:
    name: pack sweep (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Read pins
        id: pins
        run: |
          echo "leanmt_commit=$(python3 -c "import json; print(json.load(open('translation/pack-acceptance/pins.json'))['leanmt']['commit'])")" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Versta.Leanmt
        uses: actions/checkout@v4
        with:
          repository: FricoRico/Versta.Leanmt
          ref: ${{ steps.pins.outputs.leanmt_commit }}
          path: .leanmt
          submodules: recursive

      - name: Build leanmt-probe (aarch64 NEON)
        env:
          CC: clang
          CXX: clang++
        working-directory: .leanmt
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DUSE_NEON=ON -DLEANMT_BUILD_PROBE=ON
          cmake --build build --parallel --target leanmt-probe 2>&1 | tee build.log
          test -x build/probe/leanmt-probe

      - name: Cache pinned published bundles
        uses: actions/cache@v4
        with:
          path: translation/output/published
          key: pack-sweep-published-${{ hashFiles('translation/pack-acceptance/pins.json') }}

      - name: Fetch published bundles (32 packs, v2.0.0 catalog)
        working-directory: translation
        # Retry/backoff fetch (NEU-60): one transient CDN 503 must not kill a
        # 32-bundle sweep. Fetch is strict here — content pins are verified
        # next, so a missing artifact fails deliberately.
        run: |
          uv sync
          uv run python -m versta.probe.fetch --pins pack-acceptance/pins.json --output_dir output/published

      - name: Verify served bundles against published pins
        working-directory: translation
        run: |
          python3 - <<'EOF'
          import json
          from pathlib import Path
          from versta.probe.pins import load_published_pins, verify_published_bundle
          pinned = load_published_pins(Path('pack-acceptance/pins.json'))
          for name, pin in sorted(pinned['bundles'].items()):
              verify_published_bundle(Path('output/published') / name, pin['sha256'])
              print('pinned content verified:', name)
          EOF

      - name: Sweep all 32 bundles (re-pack + probe + scorecards)
        working-directory: translation
        env:
          PACK_ACCEPTANCE_RUNNER: ubuntu-24.04-arm
          PACK_ACCEPTANCE_LEANMT_COMMIT: ${{ steps.pins.outputs.leanmt_commit }}
        run: |
          uv run python -m versta.probe.sweep \
            --bundles_dir output/published \
            --probe_bin "$GITHUB_WORKSPACE/.leanmt/build/probe/leanmt-probe" \
            --output_dir output/sweep \
            --leanmt_commit "$PACK_ACCEPTANCE_LEANMT_COMMIT"

      - name: Adversarial control (negative control must trip the direction check)
        working-directory: translation
        env:
          PACK_ACCEPTANCE_RUNNER: ubuntu-24.04-arm
          PACK_ACCEPTANCE_LEANMT_COMMIT: ${{ steps.pins.outputs.leanmt_commit }}
        run: |
          # Build the direction-mislabeled control from the re-packed es-en
          # payload (extracted during the sweep, pinned above).
          tar -xzf output/published/en-es-bundle.tar.gz -C output/published
          uv run python -m versta.probe.adversarial --model_dir output/published/en-es --output_dir output/adversarial
          uv run python -m versta.probe --bundle output/adversarial/es-en-mislabeled-bundle.tar.gz \
            --probe_bin "$GITHUB_WORKSPACE/.leanmt/build/probe/leanmt-probe" \
            --output_dir output/probe-ci --expect direction-fail --label es-en.adversarial \
            --leanmt_commit "$PACK_ACCEPTANCE_LEANMT_COMMIT"

      # NEU-60 publish-gate demonstration on every run: the gate must refuse
      # the deliberately broken adversarial pack and must pass a clean
      # re-packed bundle whose card lies inside the golden bands.
      - name: Publish gate refuses the deliberately broken pack (NEU-60)
        working-directory: translation
        run: |
          set +e
          uv run python -m versta.batch.publish_gate \
            --bundle output/adversarial/es-en-mislabeled-bundle.tar.gz \
            --scorecards_dir output/probe-ci/scorecards \
            --bands_file pack-acceptance/bands.json | tee output/gate-demo.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::publish gate wrongly PUBLISHED the direction-mislabeled control pack"
            exit 1
          fi
          echo "publish gate refused the mislabeled control pack (exit $status), as designed"
          grep -q "never publish evidence" output/gate-demo.log

      - name: Publish gate passes a proven bundle (positive control)
        working-directory: translation
        run: |
          uv run python -m versta.batch.publish_gate \
            --bundle output/sweep/repacked/en-es-bundle.tar.gz \
            --scorecards_dir output/sweep/scorecards \
            --bands_file pack-acceptance/bands.json

      - name: Publish sweep summary to step summary
        run: |
          {
            echo "### pack acceptance sweep — ${{ github.sha }} (ubuntu-24.04-arm)"
            echo ""
            python3 - <<'EOF'
          import json
          summary = json.load(open('translation/output/sweep/sweep-summary.json'))
          print(f"**{summary['bundles_passing']}/{summary['bundles_total']} bundles pass "
                f"({summary['bundles_hard_failing']} hard-failing)**")
          print("")
          print('| pack | direction | load ms | chrF (floor) | direction | digits | p50 / p95 ms | RSS peak MiB |')
          print('|---|---|---:|---|---|---|---:|---:|')
          for entry in summary['bundles']:
              for d in entry.get('directions', []):
                  if d['load_ok']:
                      digits = f"{d['digit_preservation']['passed']}/{d['digit_preservation']['total']}"
                      lat = d['latency_ms']
                      print(f"| {entry['slug']} | {d['direction']} | — | "
                            f"{d['chrf']:.1f} ({d['chrf_floor']}) | {d['direction_check']} | {digits} | "
                            f"{lat['p50_ms']:.0f} / {lat['p95_ms']:.0f} | {d['rss_peak_kib']/1024:.0f} |")
                  else:
                      print(f"| {entry['slug']} | {d['direction']} | — | — | LOAD FAIL | — | — | — |")
              if 'error' in entry:
                  print(f"| {entry['slug']} | — | — | — | ERROR: {entry['error'][:60]} | — | — | — |")
          EOF
            echo ""
            echo "_Negative control: es-en-mislabeled must fail the direction check (NEU-19)._"
            echo "_Committed baselines: translation/scorecards/ incl. sweep-summary.json. Re-pin via dedicated commit only._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scorecards
        uses: actions/upload-artifact@v4
        with:
          name: pack-scorecards-${{ github.sha }}
          path: |
            translation/output/sweep/scorecards/*.json
            translation/output/sweep/sweep-summary.json
            translation/output/probe-ci/scorecards/*.json
          if-no-files-found: error
