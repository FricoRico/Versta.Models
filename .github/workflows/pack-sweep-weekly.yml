name: pack-sweep-weekly

on:
  # Weekly regression sweep over every published bundle (NEU-60): Mondays
  # 06:15 UTC. Any pack that regresses against the pinned golden bands
  # (or stops loading / serving) is filed as a defect automatically.
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

concurrency:
  group: pack-sweep-weekly
  # Never cancel a stale weekly run: a cancelled run looks like a green one
  # next to it in the defect ledger.
  cancel-in-progress: false

permissions:
  contents: read
  # The regression step files/dedupes defect issues (gh CLI).
  issues: write

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Weekly regression sweep (NEU-60, epic NEU-56).
  # Same measured path as pack-acceptance.yml — fetch the pinned published
  # packs, re-pack through the production bundler, probe on arm64 — but with a
  # different final policy: failures are NOT CI-red noise on the default
  # branch, they are filed as defects (one issue per bundle slug, deduped),
  # and the defect census (versta.pack-defects/1) is uploaded as an artifact.
  # The publish-gate verdict table shows which packs could publish unchanged
  # today; pre-existing digit-defect packs stay refused until their defect
  # fix lands (see PACK-ACCEPTANCE-RUNBOOK.md, failure taxonomy).
  # ---------------------------------------------------------------------------
  sweep:
    name: weekly sweep (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Read pins
        id: pins
        run: |
          echo "leanmt_commit=$(python3 -c "import json; print(json.load(open('translation/pack-acceptance/pins.json'))['leanmt']['commit'])")" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Versta.Leanmt
        uses: actions/checkout@v4
        with:
          repository: FricoRico/Versta.Leanmt
          ref: ${{ steps.pins.outputs.leanmt_commit }}
          path: .leanmt
          submodules: recursive

      - name: Build leanmt-probe (aarch64 NEON)
        env:
          CC: clang
          CXX: clang++
        working-directory: .leanmt
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DUSE_NEON=ON -DLEANMT_BUILD_PROBE=ON
          cmake --build build --parallel --target leanmt-probe 2>&1 | tee build.log
          test -x build/probe/leanmt-probe

      - name: Cache pinned published bundles
        uses: actions/cache@v4
        with:
          path: translation/output/published
          key: pack-sweep-published-${{ hashFiles('translation/pack-acceptance/pins.json') }}

      - name: Fetch published bundles (missing fetches become defects)
        working-directory: translation
        run: |
          uv sync
          uv run python -m versta.probe.fetch \
            --pins pack-acceptance/pins.json \
            --output_dir output/published \
            --tolerate_failures

      - name: Verify served bundles against published pins
        working-directory: translation
        run: |
          python3 - <<'EOF'
          import json
          from pathlib import Path
          from versta.probe.pins import load_published_pins, verify_published_bundle
          pinned = load_published_pins(Path('pack-acceptance/pins.json'))
          for name, pin in sorted(pinned['bundles'].items()):
              tar = Path('output/published') / name
              if not tar.is_file():
                  print('missing fetch (defect, filed below):', name)
                  continue
              verify_published_bundle(tar, pin['sha256'])
          EOF

      - name: Sweep all published bundles (re-pack + probe + scorecards)
        working-directory: translation
        env:
          PACK_ACCEPTANCE_RUNNER: ubuntu-24.04-arm
          PACK_ACCEPTANCE_LEANMT_COMMIT: ${{ steps.pins.outputs.leanmt_commit }}
        run: |
          uv run python -m versta.probe.sweep \
            --bundles_dir output/published \
            --probe_bin "$GITHUB_WORKSPACE/.leanmt/build/probe/leanmt-probe" \
            --output_dir output/sweep \
            --leanmt_commit "$PACK_ACCEPTANCE_LEANMT_COMMIT" || true

      - name: Adversarial control (negative control must trip the direction check)
        working-directory: translation
        env:
          PACK_ACCEPTANCE_RUNNER: ubuntu-24.04-arm
          PACK_ACCEPTANCE_LEANMT_COMMIT: ${{ steps.pins.outputs.leanmt_commit }}
        run: |
          tar -xzf output/published/en-es-bundle.tar.gz -C output/published
          uv run python -m versta.probe.adversarial --model_dir output/published/en-es --output_dir output/adversarial
          uv run python -m versta.probe --bundle output/adversarial/es-en-mislabeled-bundle.tar.gz \
            --probe_bin "$GITHUB_WORKSPACE/.leanmt/build/probe/leanmt-probe" \
            --output_dir output/probe-ci --expect direction-fail --label es-en.adversarial \
            --leanmt_commit "$PACK_ACCEPTANCE_LEANMT_COMMIT"

      - name: Publish-gate verdicts over the swept packs (evidence table)
        working-directory: translation
        run: |
          : > output/sweep/publish-gate.txt
          for bundle in output/sweep/repacked/*-bundle.tar.gz; do
            uv run python -m versta.batch.publish_gate \
              --bundle "$bundle" \
              --scorecards_dir output/sweep/scorecards \
              --bands_file pack-acceptance/bands.json >> output/sweep/publish-gate.txt 2>&1 || true
          done
          cat output/sweep/publish-gate.txt

      - name: Evaluate regressions -> defect census
        working-directory: translation
        run: |
          uv run python -m versta.probe.regress \
            --scorecards_dir output/sweep/scorecards \
            --bands_file pack-acceptance/bands.json \
            --sweep_summary output/sweep/sweep-summary.json \
            --output output/sweep/defects.json

      - name: Merge missing-fetch defects into the census
        working-directory: translation
        run: |
          python3 - <<'EOF'
          import json
          from pathlib import Path
          census_path = Path('output/sweep/defects.json')
          census = json.load(open(census_path))
          report_path = Path('output/published/fetch-report.json')
          if report_path.is_file():
              known = {d['slug'] for d in census['defects']}
              for entry in json.load(open(report_path))['missing']:
                  slug = entry['bundle'].replace('-bundle.tar.gz', '').replace('-bundle.tar.sha256', '')
                  if slug not in known:
                      census['defects'].append({
                          'slug': slug,
                          'card': '',
                          'bundle_sha256': None,
                          # kind: cdn-fetch-flake (transient, retries exhausted)
                          # vs artifact-missing (not served) — NEU-148.
                          'failures': [f"published artifact not served [{entry.get('kind', 'artifact-missing')}]: {entry['url']} ({entry['error']})"],
                      })
                      known.add(slug)
              census['defects'].sort(key=lambda d: d['slug'])
              census['defects_total'] = len(census['defects'])
              census_path.write_text(json.dumps(census, indent=2, ensure_ascii=False) + '\n')
          print(f"defect census: {census['defects_total']} defect(s)")
          EOF

      - name: Publish sweep summary to step summary
        run: |
          {
            echo "### weekly pack acceptance sweep — ${{ github.sha }} (ubuntu-24.04-arm)"
            echo ""
            python3 - <<'EOF'
          import json
          census = json.load(open('translation/output/sweep/defects.json'))
          print(f"**{census['defects_total']} defect(s) this sweep** "
                f"({census['cards_checked']} cards checked)")
          print("")
          if census['defects']:
              print('| pack | failures |')
              print('|---|---|')
              for defect in census['defects']:
                  print(f"| {defect['slug']} | {len(defect['failures'])} |")
          EOF
            echo ""
            echo "_Positive control: en/es sweep card must sit inside its golden band._"
            echo "_Negative control: es-en-mislabeled must fail the direction check (NEU-19)._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sweep evidence
        uses: actions/upload-artifact@v4
        with:
          name: weekly-pack-sweep-${{ github.run_id }}
          path: |
            translation/output/sweep/
            translation/output/probe-ci/scorecards/
          if-no-files-found: error

      - name: File defects (one issue per regressed bundle, deduped)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create pack-acceptance \
            --color bfd8d2 \
            --description "Automated pack acceptance defect (weekly sweep)" \
            --force
          python3 - <<'EOF'
          import json
          import os
          import subprocess

          from pathlib import Path

          census_path = Path('translation/output/sweep/defects.json')
          if not census_path.is_file():
              print('no defect census (sweep failed before evaluation); skipping filing')
              raise SystemExit(0)
          census = json.load(open(census_path))
          repo = os.environ['REPO']
          run_url = os.environ['RUN_URL']

          def gh(*args: str) -> subprocess.CompletedProcess:
              result = subprocess.run(
                  ['gh', *args], capture_output=True, text=True, check=True
              )
              return result

          for defect in census['defects']:
              slug = defect['slug']
              marker = f"Pack acceptance defect: {slug}"
              found = gh(
                  'issue', 'list', '--repo', repo, '--state', 'open',
                  '--label', 'pack-acceptance', '--search', f'in:title "{marker}"',
                  '--json', 'number,title',
              )
              open_issues = json.loads(found.stdout)
              body = (
                  "Weekly pack acceptance sweep found this bundle regressed "
                  "against the pinned golden bands / publish rules.\n\n"
                  + "\n".join(f"- {failure}" for failure in defect['failures'])
                  + f"\n\nScorecard: `{defect.get('card') or 'not emitted'}`"
                  + f"\nBundle sha256: `{defect.get('bundle_sha256') or 'n/a'}`"
                  + f"\nSweep evidence: {run_url} (artifact weekly-pack-sweep)"
                  + "\n\nTriage per translation/PACK-ACCEPTANCE-RUNBOOK.md — failure taxonomy."
              )
              if open_issues:
                  number = open_issues[0]['number']
                  gh('issue', 'comment', str(number), '--repo', repo, '--body', body)
                  print(f"commented on existing defect #{number} ({slug})")
              else:
                  first = defect['failures'][0][:72].replace('"', "'")
                  gh(
                      'issue', 'create', '--repo', repo,
                      '--title', f"{marker} — {first}",
                      '--label', 'pack-acceptance', '--body', body,
                  )
                  print(f"filed defect for {slug}")
          EOF
