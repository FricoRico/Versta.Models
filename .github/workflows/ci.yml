name: CI

on:
  push:
    paths: ["translation/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["translation/**", ".github/workflows/ci.yml"]

defaults:
  run:
    working-directory: translation

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run mypy

  test:
    name: Tests and smoke export (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      # Fully offline: the smoke export runs against a mocked Mozilla registry.
      - run: uv run pytest -v
