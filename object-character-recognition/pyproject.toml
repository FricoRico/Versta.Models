[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "versta-object-character-recognition"
dynamic = ["version"]
description = "Export PaddleOCR models to MNN (int8) and bundle them for the Versta app"
requires-python = ">=3.11,<3.12"
dependencies = [
    "setuptools>=80.0,<81.0",
    "wheel>=0.46,<0.47",
    "decorator>=5.2,<5.3",
    "numpy>=1.24,<1.25",
    "paddlepaddle>=3.0,<3.1",
    "paddle2onnx>=2.1,<2.2",
    "onnx>=1.17,<2",
    "pyyaml>=6,<7",
    "tqdm>=4.66,<5",
    "pillow>=10,<12",
    "scipy>=1.12,<2",
    "fonttools>=4.50,<5",
    "onnxruntime>=1.20,<2",
    "onnxscript>=0.7.1,<0.9",
    "mnn>=3.6,<3.7; sys_platform == 'linux'",
    "pyarrow>=25.0.1",
    "safetensors>=0.8.0",
    "onnxconverter-common>=1.16.0",
    "huggingface-hub>=1.28,<1.29",
]

[dependency-groups]
dev = [
    "ruff>=0.12,<1",
]

# Glyphmatte GPU backends for `versta.train.glyphmatte.*`: pick one with
# `uv sync --extra rocm` (AMD) or `--extra cu130` (NVIDIA).
[project.optional-dependencies]
rocm = ["torch==2.13.0+rocm7.2", "triton-rocm>=3,<4"]
cu130 = ["torch==2.13.0+cu130", "triton>=3,<4"]

# MNN only publishes Linux wheels; keep resolution limited to platforms it exists on.
[tool.uv]
environments = ["sys_platform == 'linux'"]
conflicts = [
    [
        { extra = "rocm" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-rocm", extra = "rocm" },
    { index = "pytorch-cu130", extra = "cu130" },
]
triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]
triton = [{ index = "pytorch-cu130", extra = "cu130" }]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.version]
path = "versta/version.txt"
pattern = "^v(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["versta"]
