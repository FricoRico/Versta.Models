[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "versta-object-character-recognition"
dynamic = ["version"]
description = "Export PaddleOCR models to MNN (int8) and bundle them for the Versta app"
requires-python = ">=3.11,<3.12"
dependencies = [
    "setuptools>=80.0,<81.0",
    "wheel>=0.46,<0.47",
    "decorator>=5.2,<5.3",
    "numpy>=1.24,<1.25",
    "paddlepaddle>=3.0,<3.1",
    "paddle2onnx>=2.1,<2.2",
    "onnx>=1.17,<2",
    "pyyaml>=6,<7",
    "tqdm>=4.66,<5",
]

[dependency-groups]
dev = [
    "onnxruntime>=1.20,<2",
    "pillow>=10,<12",
    "ruff>=0.12,<1",
    "mnn; sys_platform == 'linux'",
]

# MNN only publishes Linux wheels; keep resolution limited to platforms it exists on.
[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.hatch.version]
path = "versta/version.txt"
pattern = "^v(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["versta"]
