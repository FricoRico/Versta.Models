[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "versta-data"
dynamic = ["version"]
description = "Bundle shared runtime data (espeak-ng, open-jtalk) for the Versta app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "setuptools",
    "requests",
]

[dependency-groups]
dev = [
    "ruff>=0.12,<1",
]

[tool.hatch.version]
path = "versta/version.txt"
pattern = "^v(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["versta"]
